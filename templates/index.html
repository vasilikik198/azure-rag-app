<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure RAG Question Answering</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; background: #f4f7f6; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
        button { background: #0078d4; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #106ebe; }
        .result-box { margin-top: 20px; padding: 15px; background: #fafafa; border-left: 4px solid #0078d4; border-radius: 4px; }
        .sources { font-size: 0.85em; color: #666; margin-top: 10px; }
        .loader { display: none; color: #0078d4; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Azure AI Foundry RAG QA System</h2>
        <p>Ask a question based on your indexed data vector store:</p>
        
        <textarea id="queryInput" placeholder="Type your question here..."></textarea>
        <br>
        <button onclick="submitQuery()">Ask Question</button>
        <div id="loader" class="loader">Searching vector store and generating response from Azure...</div>

        <div id="resultContainer" style="display:none;" class="result-box">
            <h3>Answer:</h3>
            <p id="answerText"></p>
            <div class="sources">
                <strong>Retrieved Sources:</strong>
                <ul id="sourcesList"></ul>
            </div>
        </div>
    </div>

    <script>
        async function submitQuery() {
            const query = document.getElementById('queryInput').value;
            if (!query) return;

            document.getElementById('loader').style.display = 'block';
            document.getElementById('resultContainer').style.display = 'none';

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await response.json();

                document.getElementById('answerText').innerText = data.answer;
                
                const sourcesList = document.getElementById('sourcesList');
                sourcesList.innerHTML = '';
                data.sources.forEach(src => {
                    const li = document.createElement('li');
                    li.innerHTML = `<a href="${src.source}" target="_blank">${src.title}</a>`;
                    sourcesList.appendChild(li);
                });

                document.getElementById('resultContainer').style.display = 'block';
            } catch (err) {
                alert('Error connecting to backend server.');
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }
    </script>
</body>
</html>
